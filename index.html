<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🚀 SEO METATAGS BY SHAMIM AHAMED -->
    <title>CertifyX - Next-Gen AI Trust & Safety Engine by Shamim Ahamed</title>
    
    <meta name="author" content="Shamim Ahamed">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 📱 Top Install Banner */
        .install-banner {
            width: 100%;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border-bottom: 2px solid #00f2fe;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .install-text {
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .install-text span {
            color: #00f2fe;
            font-weight: bold;
        }

        .install-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Live Analytics Bar */
        .live-stats {
            width: 100%;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 1px solid #1e293b;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .stat-item span {
            color: #00f2fe;
            font-weight: bold;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #8fa0dd;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Tabs System */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #111827;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border-color: transparent;
        }

        .content-panel {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .content-panel.active {
            display: block;
        }

        /* Link Input Box */
        .search-box {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            border: 2px solid #1e293b;
            background-color: #111827;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
        }

        .btn-scan {
            position: absolute;
            right: 6px;
            top: 6px;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        /* Drag & Drop Media Box */
        .drop-zone {
            width: 100%;
            border: 2px dashed #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            background: #111827;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: #00f2fe;
        }

        .drop-zone p {
            color: #94a3b8;
            margin-top: 10px;
        }

        .file-input {
            display: none;
        }

        /* AI Loader Section */
        .loader-container {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
        }

        .status-text {
            color: #00f2fe;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.4s ease;
        }

        /* Dynamic Result Output Box */
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background-color: #111827;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            text-align: left;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-pdf {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .btn-pdf:hover {
            background: #ffffff;
            color: #000;
        }

        /* Social Share Section */
        .share-section {
            border-top: 1px solid #1e293b;
            padding-top: 15px;
        }

        .share-title {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .share-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-fb { background-color: #1877f2; }
        .btn-wa { background-color: #25d366; }
        .btn-tw { background-color: #1da1f2; }
        .btn-ln { background-color: #0077b5; }

        .safe { border-color: #10b981; color: #10b981; }
        .danger { border-color: #ef4444; color: #ef4444; }

        .live-feed {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #64748b;
            background: rgba(30, 41, 59, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
        }
        
        .live-feed span { color: #4facfe; }

        .trust-badges {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: bold;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
            margin-top: auto;
        }

        footer span {
            color: #00f2fe;
            font-weight: 600;
        }

        @media print {
            body { background: #fff; color: #000; }
            .install-banner, .live-stats, .tabs, .search-box, .drop-zone, .loader-container, .live-feed, .trust-badges, footer, .btn-pdf, .share-section { display: none !important; }
            .result-box { display: block !important; border: 2px solid #000; background: #fff; color: #000; box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- App Install Banner -->
    <div class="install-banner" id="installBanner">
        <div class="install-text">Access instantly from your phone. Install <span>CertifyX App</span></div>
        <button class="install-btn" id="btnInstall">Install App</button>
    </div>

    <!-- Live Analytics Dashboard -->
    <div class="live-stats">
        <div class="stat-item">🔒 System: <span>ACTIVE</span></div>
        <div class="stat-item">📊 Threats Neutralized: <span id="totalScans">1,482,924</span></div>
