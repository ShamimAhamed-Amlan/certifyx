<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifyX - Next-Gen AI Trust & Safety Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #8fa0dd;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* ট্যাব সিস্টেম */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #111827;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .content-panel {
            display: none;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s ease;
        }

        .content-panel.active {
            display: block;
        }

        /* সার্চ বক্স (ট্যাব ১) */
        .search-box {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid #1e293b;
            background-color: #111827;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .btn-scan {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* ড্রপ জোন (ট্যাব ২) */
        .drop-zone {
            width: 100%;
            border: 2px dashed #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            background: #111827;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.02);
        }

        .drop-zone p {
            color: #94a3b8;
            margin-top: 10px;
        }

        .file-input {
            display: none;
        }

        /* এআই লোডার */
        .loader-container {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
        }

        .status-text {
            color: #00f2fe;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.4s ease;
        }

        /* রেজাল্ট বক্স */
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background-color: #111827;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            text-align: left;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .safe { border-color: #10b981; color: #10b981; }
        .danger { border-color: #ef4444; color: #ef4444; }

        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 242, 254, 0.08);
            filter: blur(120px);
            border-radius: 50%;
            top: 15%;
            z-index: 1;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
            color: #64748b;
            z-index: 10;
        }

        footer span {
            color: #00f2fe;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    
    <div class="container">
        <h1>CertifyX</h1>
        <div class="tagline">The Future of Digital Trust. Developed by Shamim Ahamed.</div>
        
        <!-- ট্যাব সিলেক্টর -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('link-tab')">🔗 Scan Links / Texts</button>
            <button class="tab-btn" onclick="switchTab('deepfake-tab')">🖼️ Deepfake Media Detector</button>
        </div>

        <!-- ট্যাব ১: লিংক সার্চ -->
        <div id="link-tab" class="content-panel active">
            <div class="search-box">
                <input type="text" id="targetInput" placeholder="Paste suspicious link or message here...">
                <button class="btn-scan" onclick="startScan('link')">Scan Now</button>
            </div>
        </div>

        <!-- ট্যাব ২: ডিপফেক আপলোডার -->
        <div id="deepfake-tab" class="content-panel">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p>Drag & Drop an image/video or <b>Browse File</b></p>
                <input type="file" id="fileInput" class="file-input" onchange="startScan('file')">
            </div>
        </div>

        <!-- এআই লোডার সেকশন -->
        <div class="loader-container" id="loaderContainer">
            <div class="status-text" id="statusText">Initializing CertifyX AI Engine...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- স্ক্যান রেজাল্ট সেকশন -->
        <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle">Analysis Report</div>
            <div class="result-desc" id="resultDesc">Detailed information will appear here.</div>
        </div>
    </div>

    <footer>
        &copy; 2026 CertifyX. Designed & Developed by <span>Shamim Ahamed</span>
    </footer>

    <script>
        // ট্যাব পরিবর্তনের ফাংশন
        function switchTab(tabId) {
            document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            // রেজাল্ট ক্লিয়ার করা
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('loaderContainer').style.display = 'none';
        }

        // স্ক্যান অ্যানিমেশন ফাংশন
        function startScan(type) {
            if(type === 'link') {
                let input = document.getElementById('targetInput').value.trim();
                if(input === "") { alert("Please paste a link or text to scan!"); return; }
            } else {
                let file = document.getElementById('fileInput').files[0];
                if(!file && type==='file') { return; }
            }

            document.getElementById('resultBox').style.display = 'none';
            let loader = document.getElementById('loaderContainer');
            let progressFill = document.getElementById('progressFill');
            let statusText = document.getElementById('statusText');
            
            loader.style.display = 'block';
            progressFill.style.width = '0%';
            
            setTimeout(() => {
                progressFill.style.width = '35%';
