<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifyX - Next-Gen AI Trust & Safety Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #8fa0dd;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid #1e293b;
            background-color: #111827;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .btn-scan {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-scan:hover {
            transform: scale(1.05);
        }

        /* ফিউচারিস্টিক লোডার অ্যানিমেশন */
        .loader-container {
            display: none;
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
        }

        .status-text {
            color: #00f2fe;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* রেজাল্ট বক্স */
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background-color: #111827;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .safe { border-color: #10b981; color: #10b981; }
        .danger { border-color: #ef4444; color: #ef4444; }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 242, 254, 0.1);
            filter: blur(100px);
            border-radius: 50%;
            top: 20%;
            left: 30%;
            z-index: 1;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
            color: #64748b;
            z-index: 10;
            letter-spacing: 1px;
        }

        footer span {
            color: #00f2fe;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    
    <div class="container">
        <h1>CertifyX</h1>
        <p>The Future of Digital Trust. Verify deepfakes, links, and identities instantly.</p>
        
        <div class="search-box">
            <input type="text" id="targetInput" placeholder="Paste link, text, or profile URL to verify...">
            <button class="btn-scan" onclick="startScan()">Scan Now</button>
        </div>

        <!-- এআই লোডার সেকশন -->
        <div class="loader-container" id="loaderContainer">
            <div class="status-text" id="statusText">Initializing CertifyX AI Engine...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- স্ক্যান রেজাল্ট সেকশন -->
        <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle">Analysis Report</div>
            <div class="result-desc" id="resultDesc">Detailed information will appear here.</div>
        </div>
    </div>

    <footer>
        &copy; 2026 CertifyX. Developed by <span>Shamim Ahamed</span>
    </footer>

    <script>
        function startScan() {
            let input = document.getElementById('targetInput').value.trim();
            if(input === "") {
                alert("Please paste something to scan!");
                return;
            }

            // আগের রেজাল্ট রিসেট করা
            document.getElementById('resultBox').style.display = 'none';
            
            // লোডার চালু করা
            let loader = document.getElementById('loaderContainer');
            let progressFill = document.getElementById('progressFill');
            let statusText = document.getElementById('statusText');
            
            loader.style.display = 'block';
            progressFill.style.width = '0%';
            
            // ফেক স্ক্যানিং টাইমলাইন অ্যানিমেশন
            setTimeout(() => {
                progressFill.style.width = '30%';
                statusText.innerText = "Analyzing cryptographic signature...";
            }, 800);

            setTimeout(() => {
                progressFill.style.width = '65%';
                statusText.innerText = "Checking global trust & scam databases...";
            }, 1800);

            setTimeout(() => {
                progressFill.style.width = '100%';
                statusText.innerText = "Finalizing multi-modal AI report...";
            }, 2800);

            // স্ক্যান সম্পন্ন হলে রেজাল্ট দেখানো
            setTimeout(() => {
                loader.style.display = 'none';
                showResult(input);
            }, 3600);
        }

        function showResult(input) {
            let resultBox = document.getElementById('resultBox');
            let resultTitle = document.getElementById('resultTitle');
            let resultDesc = document.getElementById('resultDesc');
            
            resultBox.style.display = 'block';
            
            // একটি সিম্পল লজিক (ভবিষ্যতে এখানে আসল AI API বসবে)
            // যদি ইনপুটে "gift", "free", "win", "crypto" বা ভুয়া সাইটের মতো শব্দ থাকে তবে Danger দেখাবে
            let inputLower = input.toLowerCase();
            if(inputLower.includes('free') || inputLower.includes('win') || inputLower.includes('gift') || inputLower.includes('http://')) {
                resultBox.className = "result-box danger";
                resultTitle.innerText = "⚠️ HIGH RISK DETECTED";
                resultDesc.innerText = "CertifyX AI security protocols flagged this input. It matches common phishing patterns or unsecured protocols. Avoid clicking or sharing personal data.";
            } else {
                resultBox.className = "result-box safe";
                resultTitle.innerText = "🛡️ SECURE & VERIFIED";
                resultDesc.innerText = "No malicious patterns or identity mismatches found. This data appears consistent with secure web protocols. CertifyX Trust Index: 98/100.";
            }
        }
    </script>
</body>
</html>
