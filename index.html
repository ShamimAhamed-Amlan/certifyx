<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .live-stats {
            width: 100%;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 1px solid #1e293b;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 0.9rem;
            color: #94a3b8;
            z-index: 10;
        }

        .stat-item span {
            color: #00f2fe;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.3);
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #8fa0dd;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #111827;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .content-panel {
            display: none;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s ease;
        }

        .content-panel.active {
            display: block;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid #1e293b;
            background-color: #111827;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .btn-scan {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .drop-zone {
            width: 100%;
            border: 2px dashed #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            background: #111827;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.02);
        }

        .drop-zone p {
            color: #94a3b8;
            margin-top: 10px;
        }

        .file-input {
            display: none;
        }

        .loader-container {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
        }

        .status-text {
            color: #00f2fe;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.4s ease;
        }

        .result-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background-color: #111827;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            text-align: left;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-pdf {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf:hover {
            background: #ffffff;
            color: #000;
        }

        .safe { border-color: #10b981; color: #10b981; }
        .danger { border-color: #ef4444; color: #ef4444; }

        .live-feed {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #64748b;
            background: rgba(30, 41, 59, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .live-feed span { color: #4facfe; }

        .trust-badges {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .trust-badges:hover { opacity: 0.9; }

        .badge {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 1px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 242, 254, 0.08);
            filter: blur(120px);
            border-radius: 50%;
            top: 15%;
            z-index: 1;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
            color: #64748b;
            z-index: 10;
            border-top: 1px solid #1e293b;
            margin-top: 30px;
        }

        footer span {
            color: #00f2fe;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            body { background: #fff; color: #000; }
            .live-stats, .tabs, .search-box, .drop-zone, .loader-container, .live-feed, .trust-badges, footer, .glow, .btn-pdf { display: none !important; }
            .container { max-width: 100%; padding: 0; }
            h1 { background: none; -webkit-text-fill-color: #000; text-align: left; font-size: 2.5rem; }
